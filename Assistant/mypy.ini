[mypy]
python_version = 3.11
ignore_missing_imports = True
warn_unused_ignores = True
warn_redundant_casts = True
warn_unused_configs = True
no_implicit_optional = True
show_error_codes = True
warn_return_any = True
strict_optional = True

# Optional deps: don't fail on absent typing info
[mypy-transformers.*]
ignore_missing_imports = True
[mypy-langchain.*]
ignore_missing_imports = True
[mypy-langchain_community.*]
ignore_missing_imports = True
[mypy-torch.*]
ignore_missing_imports = True

# Apply stricter checks for critical modules
[mypy-backend.memory.*]
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
warn_unreachable = True
no_implicit_reexport = True
warn_unused_ignores = True

[mypy-backend.utils.*]
ignore_errors = True

# Overrides: enforce strict checks for specific utils modules
[mypy-backend.utils.unified_logger]
ignore_errors = False
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
warn_return_any = True
no_implicit_optional = True

[mypy-backend.utils.validators]
ignore_errors = False
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
warn_return_any = True
no_implicit_optional = True
