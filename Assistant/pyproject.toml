[tool.black]
line-length = 100
target-version = ["py311"]
include = "\.(py|pyi)$"

[tool.ruff]
line-length = 100
select = [
  "E",  # pycodestyle errors
  "F",  # pyflakes
  "I",  # isort
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.ruff.lint.isort]
combine-as-imports = true
force-sort-within-sections = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-q"

[project]
name = "assistant-offline"
version = "0.1.0"
description = "Offline assistant"
requires-python = ">=3.11"
