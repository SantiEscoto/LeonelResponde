services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro

  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    ports:
      - "9093:9093"
    environment:
      - SLACK_WEBHOOK_URL
      - SLACK_CHANNEL
      - SMTP_TO
      - SMTP_FROM
      - SMTP_HOST
      - SMTP_PORT=587
      - SMTP_USER
      - SMTP_PASS
      - ENVIRONMENT=jetson
    command: --config.file=/etc/alertmanager/alertmanager.yml --log.level=info --config.expand-env
    volumes:
      - ./observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro