version: "3.8"

services:
  assistant-dev:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/workspace
    working_dir: /workspace
    environment:
      - PYTHONUNBUFFERED=1
      - QT_QPA_PLATFORM=offscreen
    tty: true
    command: bash
    ports:
      - "8000:8000"
    # Uncomment platform if needed on Apple Silicon for specific emulation
    # platform: linux/arm64

  voice-ws:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/workspace
    working_dir: /workspace
    environment:
      - PYTHONUNBUFFERED=1
      - QT_QPA_PLATFORM=offscreen
      - PYTHONPATH=/workspace
      - VOICE_WS_HOST=0.0.0.0
      - VOICE_WS_PORT=8765
      - VOSK_MODEL_PATH=/workspace/models/voice/vosk-model-small-es-0.42
      - DISABLE_COQUI=0
    command: python Assistant/src/mcp_servers/voice_ws_server.py
    ports:
      - "8765:8765"