groups:
  - name: leonel-responde
    rules:
      - alert: ApiHighErrorRate
        expr: sum by(job) (rate(api_requests_error[5m])) / sum by(job) (rate(api_requests_total[5m])) > 0.10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Error rate >10% en los últimos 5m"
          description: "El porcentaje de errores de la API supera el 10%"

      - alert: ApiHighErrorRateCritical
        expr: sum by(job) (rate(api_requests_error[5m])) / sum by(job) (rate(api_requests_total[5m])) > 0.20
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Error rate >20% en los últimos 5m"
          description: "El porcentaje de errores de la API supera el 20%"

      - alert: ApiHighLatencyP95
        expr: api_latency_seconds_p95 > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Latencia P95 >800ms en 5m"
          description: "La latencia P95 de la API supera 0.8s"

      - alert: ApiHighLatencyP95Critical
        expr: api_latency_seconds_p95 > 1.5
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Latencia P95 >1.5s en 5m"
          description: "La latencia P95 de la API supera 1.5s"

      - alert: ApiDown
-        expr: up{job="leonel_responde_api"} == 0
+        expr: up{job="assistant-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "API caída (Prometheus no logra scrape del endpoint)"
          description: "El target scrape de la API está en 0 por más de 1m"