global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: assistant-api
    metrics_path: /metrics
    params:
      format: [prometheus]
    static_configs:
-      - targets: ['assistant-dev:8000']
+      - targets: ['host.docker.internal:8000']

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']