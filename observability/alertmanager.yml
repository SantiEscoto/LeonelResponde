global:
  resolve_timeout: 5m

route:
  receiver: slack_default
  group_by: ['alertname']
  group_wait: 10s
  group_interval: 2m
  repeat_interval: 2h
  routes:
    - match:
        severity: critical
      receiver: email_critical

receivers:
  - name: slack_default
    slack_configs:
      - api_url: ${SLACK_WEBHOOK_URL}
        channel: ${SLACK_CHANNEL}
        send_resolved: true
        title: "[${ENVIRONMENT}] {{ .CommonAnnotations.summary }}"
        text: "{{ range .Alerts }}\n*{{ .Labels.alertname }}* — {{ .Annotations.description }} ({{ .Labels.severity }})\n{{ end }}"

  - name: email_critical
    email_configs:
      - to: ${SMTP_TO}
        from: ${SMTP_FROM}
        smarthost: ${SMTP_HOST}:${SMTP_PORT}
        auth_username: ${SMTP_USER}
        auth_password: ${SMTP_PASS}
        require_tls: true
        send_resolved: true