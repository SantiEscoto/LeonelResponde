# CI workflow that runs tests safely in two groups to avoid segfaults caused by conflicting native libs
# Group 1: unit tests (Assistant/tests/unit) with minimal threading
# Group 2: context tests executed with pytest --forked to isolate native state between runs
# Rationale: Certain combinations (e.g., test_unified_config with context_* tests) can trigger segfaults
# due to PyTorch/Transformers native state when sharing a single Python process. Forking avoids reuse
# of the same process address space and prevents cross-test contamination.

name: CI - Safe Tests

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "1"
    defaults:
      run:
        working-directory: Assistant
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            Assistant/requirements.txt
            Assistant/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install -U pip wheel
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run unit tests (Group 1)
        run: |
          pytest -q tests/unit

      - name: Run context tests with process isolation (Group 2)
        run: |
          pytest -q --forked \
            test_context_improvements.py \
            test_context_preservation.py \
            test_robust_context_preservation.py \
            test_user_session_switch.py

  script_validation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate scripts/start.sh help
        run: bash scripts/start.sh -h